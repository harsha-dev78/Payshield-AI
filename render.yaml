# ==============================================================================
# PayShield AI — Render Deployment Blueprint
# Built for the PayPal AI Hackathon 2026 ($0 Free Tier, No Credit Card Required)
# https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # Unified Full-Stack Web Service: Express + React 19 + SQLite Risk Engine
  - type: web
    name: payshield-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: RISK_THRESHOLD_ALLOW
        value: "30"
      - key: RISK_THRESHOLD_REVIEW
        value: "65"
